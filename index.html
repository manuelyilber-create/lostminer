<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LostMiner Web Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 480px;
            max-width: 100vw;
            max-height: 100vh;
            background: #87CEEB;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        /* HUD & UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 4px;
            border: 2px solid #555;
            font-size: 14px;
        }
        .hotbar {
            pointer-events: auto;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #666;
            margin: 0 auto;
        }
        .slot {
            width: 40px;
            height: 40px;
            background: #333;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 10px;
        }
        .slot.selected {
            border-color: #ffd700;
            background: #555;
            transform: scale(1.05);
        }
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .btn-ui {
            pointer-events: auto;
            background: #444;
            color: #fff;
            border: 2px solid #777;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-ui:active {
            background: #666;
        }
        /* Overlay Modals (Crafting, Pause) */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #888;
            border-radius: 8px;
            padding: 15px;
            width: 320px;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 10;
        }
        .modal h3 {
            text-align: center;
            color: #ffd700;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .recipe-item button {
            background: #28a745;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .recipe-item button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        /* On-Screen Mobile Controls */
        #touch-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .d-pad, .action-pad {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }
        .touch-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="top-bar">
                <div class="stats" id="stats-display">HP: ❤️❤️❤️❤️❤️ | Tiempo: Día</div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-ui" onclick="toggleCrafting()">🔨 Crafting</button>
                    <button class="btn-ui" onclick="saveGame()">💾 Guardar</button>
                </div>
            </div>

            <div class="hotbar" id="hotbar"></div>
        </div>

        <!-- Crafting Modal -->
        <div class="modal" id="crafting-modal">
            <h3>Mesa de Crafting</h3>
            <div id="crafting-list"></div>
            <button class="btn-ui" style="margin-top: 10px;" onclick="toggleCrafting()">Cerrar</button>
        </div>

        <!-- Touch Controls for Mobile/Infinix -->
        <div id="touch-controls">
            <div class="d-pad">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="action-pad">
                <div class="touch-btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>

<script>
// --- CONFIGURACIÓN Y CONSTANTES DEL JUEGO ---
const TILE_SIZE = 16;
const WORLD_WIDTH = 120; // Bloques de ancho
const WORLD_HEIGHT = 80; // Bloques de alto
const GRAVITY = 0.35;

// IDs de Bloques
const BLOCK = {
    AIR: 0,
    DIRT: 1,
    GRASS: 2,
    STONE: 3,
    WOOD: 4,
    LEAVES: 5,
    COAL: 6,
    IRON: 7,
    PLANKS: 8,
    TORCH: 9,
    WORKBENCH: 10
};

// Propiedades de Bloques e Ítems
const BLOCK_DATA = {
    [BLOCK.AIR]: { name: "Aire", color: "transparent", solid: false },
    [BLOCK.DIRT]: { name: "Tierra", color: "#8B4513", solid: true },
    [BLOCK.GRASS]: { name: "Pasto", color: "#4D8C28", solid: true },
    [BLOCK.STONE]: { name: "Piedra", color: "#708090", solid: true },
    [BLOCK.WOOD]: { name: "Madera", color: "#5C4033", solid: true },
    [BLOCK.LEAVES]: { name: "Hojas", color: "#2E8B57", solid: true },
    [BLOCK.COAL]: { name: "Carbón", color: "#222222", solid: true },
    [BLOCK.IRON]: { name: "Hierro", color: "#D2B48C", solid: true },
    [BLOCK.PLANKS]: { name: "Tablas", color: "#A0522D", solid: true },
    [BLOCK.TORCH]: { name: "Antorcha", color: "#FFD700", solid: false, light: true },
    [BLOCK.WORKBENCH]: { name: "Mesa", color: "#CD853F", solid: true }
};

// Recetas de Crafting
const RECIPES = [
    { result: BLOCK.PLANKS, count: 4, req: [{ id: BLOCK.WOOD, count: 1 }], name: "Tablas de Madera" },
    { result: BLOCK.TORCH, count: 4, req: [{ id: BLOCK.WOOD, count: 1 }, { id: BLOCK.COAL, count: 1 }], name: "Antorchas" },
    { result: BLOCK.WORKBENCH, count: 1, req: [{ id: BLOCK.PLANKS, count: 4 }], name: "Mesa de Trabajo" }
];

// --- ESTADO DEL JUEGO ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 480;

let world = [];
let timeOfDay = 0; // 0 a 1000
let camera = { x: 0, y: 0 };

let player = {
    x: (WORLD_WIDTH * TILE_SIZE) / 2,
    y: 100,
    vx: 0,
    vy: 0,
    width: 12,
    height: 24,
    grounded: false,
    hp: 5,
    selectedSlot: 0,
    inventory: [
        { id: BLOCK.DIRT, count: 10 },
        { id: BLOCK.WOOD, count: 5 },
        { id: BLOCK.TORCH, count: 2 },
        { id: BLOCK.AIR, count: 0 },
        { id: BLOCK.AIR, count: 0 },
        { id: BLOCK.AIR, count: 0 }
    ]
};

let keys = {};
let touchLeft = false, touchRight = false, touchJump = false;

// --- GENERACIÓN PROCEDURAL DEL MUNDO ---
function generateWorld() {
    world = new Array(WORLD_WIDTH * WORLD_HEIGHT).fill(BLOCK.AIR);

    // Superficie con Onda Senoidal (Simulando terreno procedural)
    for (let x = 0; x < WORLD_WIDTH; x++) {
        let heightOffset = Math.floor(Math.sin(x * 0.1) * 4) + Math.floor(Math.cos(x * 0.05) * 6);
        let surfaceY = 30 + heightOffset;

        for (let y = 0; y < WORLD_HEIGHT; y++) {
            let index = y * WORLD_WIDTH + x;

            if (y === surfaceY) {
                world[index] = BLOCK.GRASS;
            } else if (y > surfaceY && y < surfaceY + 6) {
                world[index] = BLOCK.DIRT;
            } else if (y >= surfaceY + 6) {
                // Minerales aleatorios
                let rand = Math.random();
                if (rand < 0.05) world[index] = BLOCK.COAL;
                else if (rand < 0.02) world[index] = BLOCK.IRON;
                else world[index] = BLOCK.STONE;
            }
        }

        // Árboles
        if (x > 5 && x < WORLD_WIDTH - 5 && Math.random() < 0.12 && surfaceY > 15) {
            let treeY = surfaceY - 1;
            for (let h = 0; h < 4; h++) {
                setBlock(x, treeY - h, BLOCK.WOOD);
            }
            // Copas de árbol
            for (let lx = -1; lx <= 1; lx++) {
                for (let ly = -2; ly <= 0; ly++) {
                    if (getBlock(x + lx, treeY - 3 + ly) === BLOCK.AIR) {
                        setBlock(x + lx, treeY - 3 + ly, BLOCK.LEAVES);
                    }
                }
            }
        }
    }
}

function getBlock(x, y) {
    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) return BLOCK.STONE;
    return world[y * WORLD_WIDTH + x];
}

function setBlock(x, y, type) {
    if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
        world[y * WORLD_WIDTH + x] = type;
    }
}

// --- FÍSICAS Y ACTUALIZACIÓN DEL JUGADOR ---
function updatePlayer() {
    // Movimiento Horizontal
    let moveSpeed = 2.2;
    if (keys["ArrowLeft"] || keys["a"] || touchLeft) player.vx = -moveSpeed;
    else if (keys["ArrowRight"] || keys["d"] || touchRight) player.vx = moveSpeed;
    else player.vx *= 0.7;

    // Salto
    if ((keys["ArrowUp"] || keys["w"] || keys[" "] || touchJump) && player.grounded) {
        player.vy = -6.5;
        player.grounded = false;
    }

    // Gravedad
    player.vy += GRAVITY;

    // Colisión X
    player.x += player.vx;
    if (checkCollision()) {
        player.x -= player.vx;
        player.vx = 0;
    }

    // Colisión Y
    player.y += player.vy;
    if (checkCollision()) {
        player.y -= player.vy;
        if (player.vy > 0) player.grounded = true;
        player.vy = 0;
    } else {
        player.grounded = false;
    }

    // Cámara centrada en el jugador
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    // Límites de Cámara
    camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH * TILE_SIZE - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT * TILE_SIZE - canvas.height));
}

function checkCollision() {
    let left = Math.floor(player.x / TILE_SIZE);
    let right = Math.floor((player.x + player.width) / TILE_SIZE);
    let top = Math.floor(player.y / TILE_SIZE);
    let bottom = Math.floor((player.y + player.height) / TILE_SIZE);

    for (let x = left; x <= right; x++) {
        for (let y = top; y <= bottom; y++) {
            let b = getBlock(x, y);
            if (BLOCK_DATA[b] && BLOCK_DATA[b].solid) return true;
        }
    }
    return false;
}

// --- CICLO DÍA / NOCHE ---
function updateDayNight() {
    timeOfDay = (timeOfDay + 0.1) % 1000;
}

// --- RENDERIZADO (DIBUJAR EN PANTALLA) ---
function render() {
    // Fondo de cielo según hora del día
    let skyBrightness = Math.sin((timeOfDay / 1000) * Math.PI);
    let skyR = Math.floor(135 * Math.max(0.2, skyBrightness));
    let skyG = Math.floor(206 * Math.max(0.2, skyBrightness));
    let skyB = Math.floor(235 * Math.max(0.3, skyBrightness));
    ctx.fillStyle = `rgb(${skyR}, ${skyG}, ${skyB})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

    // Dibujar Mundo de Bloques (Solo bloques visibles en cámara)
    let startX = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    let endX = Math.min(WORLD_WIDTH, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
    let startY = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    let endY = Math.min(WORLD_HEIGHT, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

    for (let x = startX; x < endX; x++) {
        for (let y = startY; y < endY; y++) {
            let block = getBlock(x, y);
            if (block !== BLOCK.AIR) {
                ctx.fillStyle = BLOCK_DATA[block].color;
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = "rgba(0,0,0,0.15)";
                ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // Dibujar Jugador
    ctx.fillStyle = "#FF4500"; // Cuerpo del minero
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "#FFD700"; // Casco de minería
    ctx.fillRect(player.x - 1, player.y, player.width + 2, 6);

    ctx.restore();

    // Oscuridad nocturna (Overlay)
    if (skyBrightness < 0.5) {
        let nightAlpha = (0.5 - skyBrightness) * 1.5;
        ctx.fillStyle = `rgba(5, 5, 20, ${Math.min(0.75, nightAlpha)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    updateUI();
}

// --- INTERACCIÓN: MINAR Y CONSTRUIR CON EL MOUSE / TOUCH ---
canvas.addEventListener("mousedown", (e) => {
    let rect = canvas.getBoundingClientRect();
    let clickX = e.clientX - rect.left + camera.x;
    let clickY = e.clientY - rect.top + camera.y;

    let tileX = Math.floor(clickX / TILE_SIZE);
    let tileY = Math.floor(clickY / TILE_SIZE);

    // Distancia máxima de alcance del personaje
    let playerTileX = Math.floor((player.x + player.width / 2) / TILE_SIZE);
    let playerTileY = Math.floor((player.y + player.height / 2) / TILE_SIZE);
    let dist = Math.hypot(tileX - playerTileX, tileY - playerTileY);

    if (dist > 6) return; // Fuera de alcance

    let targetBlock = getBlock(tileX, tileY);

    // Clic Izquierdo: Romper Bloque
    if (e.button === 0) {
        if (targetBlock !== BLOCK.AIR) {
            addToInventory(targetBlock, 1);
            setBlock(tileX, tileY, BLOCK.AIR);
        }
    } 
    // Clic Derecho: Colocar Bloque
    else if (e.button === 2) {
        let activeItem = player.inventory[player.selectedSlot];
        if (targetBlock === BLOCK.AIR && activeItem.id !== BLOCK.AIR && activeItem.count > 0) {
            setBlock(tileX, tileY, activeItem.id);
            activeItem.count--;
            if (activeItem.count <= 0) activeItem.id = BLOCK.AIR;
        }
    }
});

canvas.addEventListener("contextmenu", e => e.preventDefault());

// --- INVENTARIO Y CRAFTING SISTEMA ---
function addToInventory(blockId, amount) {
    // Buscar si ya existe en un slot
    for (let slot of player.inventory) {
        if (slot.id === blockId) {
            slot.count += amount;
            return;
        }
    }
    // Buscar slot vacío
    for (let slot of player.inventory) {
        if (slot.id === BLOCK.AIR) {
            slot.id = blockId;
            slot.count = amount;
            return;
        }
    }
}

function updateUI() {
    // Barra de Vida e Información
    let hearts = "❤️".repeat(player.hp);
    let timeName = timeOfDay < 500 ? "Día ☀️" : "Noche 🌙";
    document.getElementById("stats-display").innerText = `HP: ${hearts} | Tiempo: ${timeName}`;

    // Dibujar Hotbar
    let hotbarEl = document.getElementById("hotbar");
    hotbarEl.innerHTML = "";
    player.inventory.forEach((slot, i) => {
        let slotDiv = document.createElement("div");
        slotDiv.className = `slot ${i === player.selectedSlot ? 'selected' : ''}`;
        slotDiv.onclick = () => player.selectedSlot = i;

        if (slot.id !== BLOCK.AIR) {
            slotDiv.style.backgroundColor = BLOCK_DATA[slot.id].color;
            let countSpan = document.createElement("span");
            countSpan.className = "slot-count";
            countSpan.innerText = slot.count;
            slotDiv.appendChild(countSpan);
        }
        hotbarEl.appendChild(slotDiv);
    });
}

function toggleCrafting() {
    let modal = document.getElementById("crafting-modal");
    if (modal.style.display === "flex") {
        modal.style.display = "none";
    } else {
        modal.style.display = "flex";
        renderCraftingList();
    }
}

function renderCraftingList() {
    let listEl = document.getElementById("crafting-list");
    listEl.innerHTML = "";

    RECIPES.forEach(recipe => {
        let canCraft = recipe.req.every(req => {
            let item = player.inventory.find(s => s.id === req.id);
            return item && item.count >= req.count;
        });

        let div = document.createElement("div");
        div.className = "recipe-item";
        div.innerHTML = `
            <div>
                <strong>${recipe.name}</strong><br>
                <small>Req: ${recipe.req.map(r => `${BLOCK_DATA[r.id].name} x${r.count}`).join(', ')}</small>
            </div>
        `;
        let btn = document.createElement("button");
        btn.innerText = "Crear";
        btn.disabled = !canCraft;
        btn.onclick = () => {
            recipe.req.forEach(r => {
                let item = player.inventory.find(s => s.id === r.id);
                item.count -= r.count;
                if (item.count <= 0) item.id = BLOCK.AIR;
            });
            addToInventory(recipe.result, recipe.count);
            renderCraftingList();
            updateUI();
        };
        div.appendChild(btn);
        listEl.appendChild(div);
    });
}

// --- GUARDAR Y CARGAR PARTIDA ---
function saveGame() {
    let saveData = {
        world: world,
        player: player,
        timeOfDay: timeOfDay
    };
    localStorage.setItem("lostminer_save", JSON.stringify(saveData));
    alert("¡Juego guardado con éxito en el navegador!");
}

function loadGame() {
    let saved = localStorage.getItem("lostminer_save");
    if (saved) {
        let data = JSON.parse(saved);
        world = data.world;
        player = data.player;
        timeOfDay = data.timeOfDay;
    } else {
        generateWorld();
    }
}

// --- TECLADO Y MANDOS TÁCTILES ---
window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key >= "1" && e.key <= "6") player.selectedSlot = parseInt(e.key) - 1;
});
window.addEventListener("keyup", e => keys[e.key] = false);

// Eventos Táctiles para Móvil
function bindTouch(id, setter) {
    let el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); setter(true); });
    el.addEventListener("touchend", (e) => { e.preventDefault(); setter(false); });
}
bindTouch("btn-left", v => touchLeft = v);
bindTouch("btn-right", v => touchRight = v);
bindTouch("btn-jump", v => touchJump = v);

// --- BUCLE PRINCIPAL (GAME LOOP) ---
function gameLoop() {
    updatePlayer();
    updateDayNight();
    render();
    requestAnimationFrame(gameLoop);
}

// Iniciar Juego
loadGame();
gameLoop();
</script>
</body>
</html>
