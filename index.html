<body>

    <div id="game-container">

        <div id="ui-layer">

<script>
// --- MOTOR NATIVO RETRO (LOSTMINER RESOLUTION) ---
const INTERNAL_RES_X = 425;
const INTERNAL_RES_Y = 240;
const TILE_SIZE = 16;
const WORLD_WIDTH = 200;
const WORLD_HEIGHT = 120;
const GRAVITY = 0.32;

// IDs de Bloques
const B = {
    AIR: 0, DIRT: 1, GRASS: 2, STONE: 3, WOOD: 4, LEAVES: 5,
    COAL: 6, IRON: 7, GOLD: 8, DIAMOND: 9, PLANKS: 10,
    TORCH: 11, WORKBENCH: 12, BED: 13, PICKAXE_WOOD: 14,
    PICKAXE_STONE: 15, SWORD_WOOD: 16, SWORD_IRON: 17, MEAT: 18
};

const BLOCK_DATA = {
    [B.AIR]: { name: "Aire", color: "transparent", solid: false },
    [B.DIRT]: { name: "Tierra", color: "#6e3c19", solid: true, hard: 1 },
    [B.GRASS]: { name: "Pasto", color: "#3d7e24", solid: true, hard: 1 },
    [B.STONE]: { name: "Piedra", color: "#5a5a66", solid: true, hard: 3 },
    [B.WOOD]: { name: "Madera", color: "#4a2f1d", solid: true, hard: 2 },
    [B.LEAVES]: { name: "Hojas", color: "#2d6628", solid: true, hard: 1 },
    [B.COAL]: { name: "Carbón", color: "#222226", solid: true, hard: 3 },
    [B.IRON]: { name: "Hierro", color: "#b88e63", solid: true, hard: 4 },
    [B.GOLD]: { name: "Oro", color: "#d4af37", solid: true, hard: 5 },
    [B.DIAMOND]: { name: "Diamante", color: "#40e0d0", solid: true, hard: 6 },
    [B.PLANKS]: { name: "Tablas", color: "#8b5a2b", solid: true, hard: 2 },
    [B.TORCH]: { name: "Antorcha", color: "#ffcc00", solid: false, light: true },
    [B.WORKBENCH]: { name: "Mesa Crafting", color: "#a0522d", solid: true, hard: 2 },
    [B.BED]: { name: "Cama", color: "#cc2222", solid: true, hard: 2 },
    [B.PICKAXE_WOOD]: { name: "Pico de Madera", color: "#8b5a2b", tool: true, power: 2 },
    [B.PICKAXE_STONE]: { name: "Pico de Piedra", color: "#708090", tool: true, power: 4 },
    [B.SWORD_WOOD]: { name: "Espada de Madera", color: "#8b5a2b", weapon: true, dmg: 3 },
    [B.SWORD_IRON]: { name: "Espada de Hierro", color: "#dcdcdc", weapon: true, dmg: 6 },
    [B.MEAT]: { name: "Carne", color: "#cc4444", food: true, heal: 3 }
};

const RECIPES = [
    { result: B.PLANKS, count: 4, req: [{ id: B.WOOD, count: 1 }], name: "Tablas de Madera" },
    { result: B.TORCH, count: 4, req: [{ id: B.WOOD, count: 1 }, { id: B.COAL, count: 1 }], name: "Antorchas x4" },
    { result: B.WORKBENCH, count: 1, req: [{ id: B.PLANKS, count: 4 }], name: "Mesa de Trabajo" },
    { result: B.PICKAXE_WOOD, count: 1, req: [{ id: B.PLANKS, count: 3 }], name: "Pico de Madera" },
    { result: B.PICKAXE_STONE, count: 1, req: [{ id: B.STONE, count: 3 }, { id: B.WOOD, count: 2 }], name: "Pico de Piedra" },
    { result: B.SWORD_WOOD, count: 1, req: [{ id: B.PLANKS, count: 2 }], name: "Espada de Madera" },
    { result: B.SWORD_IRON, count: 1, req: [{ id: B.IRON, count: 2 }, { id: B.WOOD, count: 1 }], name: "Espada de Hierro" }
];

// Canvas Setup
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = INTERNAL_RES_X;
canvas.height = INTERNAL_RES_Y;

let world = [];
let lightMap = [];
let enemies = [];
let itemsOnGround = [];
let timeOfDay = 0; // 0..1000
let camera = { x: 0, y: 0 };

let player = {
    x: (WORLD_WIDTH * TILE_SIZE) / 2,
    y: 100,
    vx: 0, vy: 0,
    width: 10, height: 22,
    grounded: false,
    hp: 10, maxHp: 10,
    food: 10, maxFood: 10,
    selectedSlot: 0,
    facing: 1, // 1 der, -1 izq
    inventory: [
        { id: B.PICKAXE_WOOD, count: 1 },
        { id: B.SWORD_WOOD, count: 1 },
        { id: B.TORCH, count: 5 },
        { id: B.MEAT, count: 3 },
        { id: B.AIR, count: 0 },
        { id: B.AIR, count: 0 }
    ]
};

let keys = {};
let touchLeft = false, touchRight = false, touchJump = false, touchAttack = false;

// --- GENERACIÓN DEL MUNDO RICA (CUEVAS + MINERALES) ---
function generateWorld() {
    world = new Array(WORLD_WIDTH * WORLD_HEIGHT).fill(B.AIR);
    lightMap = new Array(WORLD_WIDTH * WORLD_HEIGHT).fill(1.0);

    for (let x = 0; x < WORLD_WIDTH; x++) {
        let heightOffset = Math.floor(Math.sin(x * 0.08) * 6) + Math.floor(Math.cos(x * 0.03) * 8);
        let surfaceY = 40 + heightOffset;

        for (let y = 0; y < WORLD_HEIGHT; y++) {
            let idx = y * WORLD_WIDTH + x;

            if (y === surfaceY) {
                world[idx] = B.GRASS;
            } else if (y > surfaceY && y < surfaceY + 8) {
                world[idx] = B.DIRT;
            } else if (y >= surfaceY + 8) {
                // Cuevas con ruido aleatorio
                let caveVal = Math.sin(x * 0.2) + Math.cos(y * 0.2);
                if (caveVal < 0.2 && y > surfaceY + 12 && y < WORLD_HEIGHT - 10) {
                    world[idx] = B.AIR;
                } else {
                    let rand = Math.random();
                    if (rand < 0.015 && y > surfaceY + 45) world[idx] = B.DIAMOND;
                    else if (rand < 0.035 && y > surfaceY + 30) world[idx] = B.GOLD;
                    else if (rand < 0.06) world[idx] = B.IRON;
                    else if (rand < 0.1) world[idx] = B.COAL;
                    else world[idx] = B.STONE;
                }
            }
        }

        // Generar Árboles
        if (x > 5 && x < WORLD_WIDTH - 5 && Math.random() < 0.15) {
            let treeY = surfaceY - 1;
            for (let h = 0; h < 5; h++) setBlock(x, treeY - h, B.WOOD);
            for (let lx = -2; lx <= 2; lx++) {
                for (let ly = -3; ly <= 0; ly++) {
                    if (getBlock(x + lx, treeY - 4 + ly) === B.AIR) setBlock(x + lx, treeY - 4 + ly, B.LEAVES);
                }
            }
        }
    }
}

function getBlock(x, y) {
    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) return B.STONE;
    return world[y * WORLD_WIDTH + x];
}

function setBlock(x, y, type) {
    if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
        world[y * WORLD_WIDTH + x] = type;
    }
}

// --- ENEMIGOS E INTELIGENCIA ARTIFICIAL ---
function spawnZombies() {
    let isNight = timeOfDay > 500;
    if (isNight && enemies.length < 5 && Math.random() < 0.02) {
        let spawnX = player.x + (Math.random() > 0.5 ? 200 : -200);
        if (spawnX > 50 && spawnX < WORLD_WIDTH * TILE_SIZE - 50) {
            enemies.push({
                x: spawnX, y: player.y - 40,
                vx: 0, vy: 0, width: 12, height: 22,
                hp: 8, maxHp: 8, type: 'zombie'
            });
        }
    }
}

function updateEnemies() {
    enemies.forEach((e, idx) => {
        // Seguimiento al jugador
        if (e.x < player.x) { e.vx = 0.8; }
        else { e.vx = -0.8; }

        e.vy += GRAVITY;
        e.x += e.vx;
        e.y += e.vy;

        // Colisión simple con suelo
        let tileX = Math.floor(e.x / TILE_SIZE);
        let tileY = Math.floor((e.y + e.height) / TILE_SIZE);
        if (BLOCK_DATA[getBlock(tileX, tileY)]?.solid) {
            e.y = tileY * TILE_SIZE - e.height;
            e.vy = 0;
            // Salto automático de obstáculos
            if (BLOCK_DATA[getBlock(tileX + (e.vx > 0 ? 1 : -1), tileY)]?.solid) e.vy = -5;
        }

        // Daño al jugador
        if (Math.abs(e.x - player.x) < 12 && Math.abs(e.y - player.y) < 18) {
            player.hp = Math.max(0, player.hp - 0.05);
        }

        if (e.hp <= 0) {
            itemsOnGround.push({ x: e.x, y: e.y, id: B.MEAT, count: 1 });
            enemies.splice(idx, 1);
        }
    });
}

// --- ACTUALIZACIÓN DEL JUGADOR ---
function updatePlayer() {
    let speed = 2.0;
    if (keys["ArrowLeft"] || keys["a"] || touchLeft) { player.vx = -speed; player.facing = -1; }
    else if (keys["ArrowRight"] || keys["d"] || touchRight) { player.vx = speed; player.facing = 1; }
    else player.vx *= 0.6;

    if ((keys["ArrowUp"] || keys["w"] || keys[" "] || touchJump) && player.grounded) {
        player.vy = -6.2;
        player.grounded = false;
    }

    player.vy += GRAVITY;

    // Físicas X
    player.x += player.vx;
    if (checkCollision()) { player.x -= player.vx; player.vx = 0; }

    // Físicas Y
    player.y += player.vy;
    if (checkCollision()) {
        player.y -= player.vy;
        if (player.vy > 0) player.grounded = true;
        player.vy = 0;
    } else player.grounded = false;

    // Recoger ítems del suelo
    itemsOnGround.forEach((item, idx) => {
        if (Math.hypot(item.x - player.x, item.y - player.y) < 20) {
            addToInventory(item.id, item.count);
            itemsOnGround.splice(idx, 1);
        }
    });

    // Ataque con botón/tecla
    if (touchAttack || keys["f"]) {
        enemies.forEach(e => {
            if (Math.hypot(e.x - player.x, e.y - player.y) < 30) {
                let active = player.inventory[player.selectedSlot];
                let dmg = BLOCK_DATA[active.id]?.dmg || 1;
                e.hp -= dmg;
                e.vx = player.facing * 3; // Empujón
            }
        });
    }

    // Centrar Cámara
    camera.x = player.x - INTERNAL_RES_X / 2;
    camera.y = player.y - INTERNAL_RES_Y / 2;
    camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH * TILE_SIZE - INTERNAL_RES_X));
    camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT * TILE_SIZE - INTERNAL_RES_Y));
}

function checkCollision() {
    let left = Math.floor(player.x / TILE_SIZE);
    let right = Math.floor((player.x + player.width) / TILE_SIZE);
    let top = Math.floor(player.y / TILE_SIZE);
    let bottom = Math.floor((player.y + player.height) / TILE_SIZE);

    for (let x = left; x <= right; x++) {
        for (let y = top; y <= bottom; y++) {
            if (BLOCK_DATA[getBlock(x, y)]?.solid) return true;
        }
    }
    return false;
}

// --- RENDERIZADO RETRO EN CANVAS NATIVO ---
function render() {
    let skyBrightness = Math.sin((timeOfDay / 1000) * Math.PI);
    let skyR = Math.floor(110 * Math.max(0.15, skyBrightness));
    let skyG = Math.floor(180 * Math.max(0.15, skyBrightness));
    let skyB = Math.floor(220 * Math.max(0.2, skyBrightness));
    ctx.fillStyle = `rgb(${skyR}, ${skyG}, ${skyB})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

    // Dibujar Bloques Visibles
    let startX = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    let endX = Math.min(WORLD_WIDTH, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
    let startY = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    let endY = Math.min(WORLD_HEIGHT, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

    for (let x = startX; x < endX; x++) {
        for (let y = startY; y < endY; y++) {
            let b = getBlock(x, y);
            if (b !== B.AIR) {
                ctx.fillStyle = BLOCK_DATA[b].color;
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = "rgba(0,0,0,0.12)";
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE + 12, TILE_SIZE, 4);
            }
        }
    }

    // Ítems tirados en suelo
    itemsOnGround.forEach(item => {
        ctx.fillStyle = BLOCK_DATA[item.id].color;
        ctx.fillRect(item.x, item.y, 6, 6);
    });

    // Enemigos
    enemies.forEach(e => {
        ctx.fillStyle = "#2e8b57"; // Zombie color
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = "#ff0000"; // Ojos
        ctx.fillRect(e.x + (e.vx > 0 ? 8 : 2), e.y + 4, 3, 3);
    });

    // Jugador estilo LostMiner
    ctx.fillStyle = "#e0ac69"; // Piel
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "#2244aa"; // Camisa
    ctx.fillRect(player.x, player.y + 6, player.width, 10);
    ctx.fillStyle = "#ffcc00"; // Casco
    ctx.fillRect(player.x - 1, player.y - 2, player.width + 2, 6);

    ctx.restore();

    // Sombra de Noche
    if (skyBrightness < 0.5) {
        let nightAlpha = (0.5 - skyBrightness) * 1.6;
        ctx.fillStyle = `rgba(5, 5, 18, ${Math.min(0.82, nightAlpha)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    updateHUD();
}

// Interacción Clic / Tap
canvas.addEventListener("mousedown", (e) => {
    let rect = canvas.getBoundingClientRect();
    let scaleX = canvas.width / rect.width;
    let scaleY = canvas.height / rect.height;

    let clickX = (e.clientX - rect.left) * scaleX + camera.x;
    let clickY = (e.clientY - rect.top) * scaleY + camera.y;

    let tileX = Math.floor(clickX / TILE_SIZE);
    let tileY = Math.floor(clickY / TILE_SIZE);

    let targetBlock = getBlock(tileX, tileY);
    let activeItem = player.inventory[player.selectedSlot];

    if (e.button === 0 && targetBlock !== B.AIR) { // Romper
        addToInventory(targetBlock, 1);
        setBlock(tileX, tileY, B.AIR);
    } else if (e.button === 2 && targetBlock === B.AIR && activeItem.count > 0) { // Colocar
        if (BLOCK_DATA[activeItem.id]?.solid || BLOCK_DATA[activeItem.id]?.light) {
            setBlock(tileX, tileY, activeItem.id);
            activeItem.count--;
            if (activeItem.count <= 0) activeItem.id = B.AIR;
        } else if (BLOCK_DATA[activeItem.id]?.food) { // Comer
            player.hp = Math.min(player.maxHp, player.hp + BLOCK_DATA[activeItem.id].heal);
            activeItem.count--;
            if (activeItem.count <= 0) activeItem.id = B.AIR;
        }
    }
});

canvas.addEventListener("contextmenu", e => e.preventDefault());

function addToInventory(id, count) {
    let slot = player.inventory.find(s => s.id === id) || player.inventory.find(s => s.id === B.AIR);
    if (slot) { slot.id = id; slot.count = (slot.count || 0) + count; }
}

function updateHUD() {
    document.getElementById("hp-val").innerText = Math.ceil(player.hp);
    document.getElementById("time-val").innerText = timeOfDay < 500 ? "☀️ Día" : "🌙 Noche";

    let hotbarEl = document.getElementById("hotbar");
    hotbarEl.innerHTML = "";
    player.inventory.forEach((slot, i) => {
        let div = document.createElement("div");
        div.className = `slot ${i === player.selectedSlot ? 'selected' : ''}`;
        div.onclick = () => player.selectedSlot = i;

        if (slot.id !== B.AIR) {
            div.style.backgroundColor = BLOCK_DATA[slot.id].color;
            div.innerHTML = `<span class="slot-count">${slot.count}</span><span class="slot-name">${BLOCK_DATA[slot.id].name}</span>`;
        }
        hotbarEl.appendChild(div);
    });
}

function toggleCrafting() {
    let m = document.getElementById("crafting-modal");
    m.style.display = m.style.display === "flex" ? "none" : "flex";
    if (m.style.display === "flex") {
        let list = document.getElementById("crafting-list");
        list.innerHTML = "";
        RECIPES.forEach(r => {
            let can = r.req.every(req => (player.inventory.find(s => s.id === req.id)?.count || 0) >= req.count);
            let card = document.createElement("div");
            card.className = "recipe-card";
            card.innerHTML = `<div><strong>${r.name}</strong><br><small>${r.req.map(req => BLOCK_DATA[req.id].name + ' x' + req.count).join(', ')}</small></div>`;
            let btn = document.createElement("button");
            btn.innerText = "Fabricar";
            btn.disabled = !can;
            btn.onclick = () => {
                r.req.forEach(req => {
                    let s = player.inventory.find(item => item.id === req.id);
                    s.count -= req.count;
                    if (s.count <= 0) s.id = B.AIR;
                });
                addToInventory(r.result, r.count);
                toggleCrafting();
            };
            card.appendChild(btn);
            list.appendChild(card);
        });
    }
}

function saveGame() {
    localStorage.setItem("lostminer_full_save", JSON.stringify({ world, player, timeOfDay }));
    alert("¡Partida guardada correctamente!");
}

function loadGame() {
    let saved = localStorage.getItem("lostminer_full_save");
    if (saved) {
        let data = JSON.parse(saved);
        world = data.world; player = data.player; timeOfDay = data.timeOfDay;
    } else generateWorld();
}

// Bucle Principal
window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key >= "1" && e.key <= "6") player.selectedSlot = parseInt(e.key) - 1;
});
window.addEventListener("keyup", e => keys[e.key] = false);

function bindTouch(id, fn) {
    let el = document.getElementById(id);
    el.addEventListener("touchstart", e => { e.preventDefault(); fn(true); });
    el.addEventListener("touchend", e => { e.preventDefault(); fn(false); });
}
bindTouch("btn-left", v => touchLeft = v);
bindTouch("btn-right", v => touchRight = v);
bindTouch("btn-jump", v => touchJump = v);
bindTouch("btn-attack", v => touchAttack = v);

loadGame();
function gameLoop() {
    timeOfDay = (timeOfDay + 0.08) % 1000;
    spawnZombies();
    updateEnemies();
    updatePlayer();
    render();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
